<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070f1f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>تحميل عرض الورشة | أ. رشدي سيد</title>
<style>
:root{color-scheme:dark;--navy:#070f1f;--panel:#12213b;--line:#25385c;--ink:#eef3fb;--muted:#9fb0c9;--gold:#e3c26b;--goldG:linear-gradient(135deg,#bf953f,#fcf6ba,#b38728,#fbf5b7,#aa771c);--teal:#2ec4b6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--navy);color:var(--ink);font-family:'Tajawal','Geeza Pro','Segoe UI',Arial,sans-serif}
body{min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));display:flex}
main{width:100%;max-width:520px;margin:auto;display:flex;flex-direction:column;gap:14px;text-align:center}
img{width:96px;height:96px;border-radius:22px;margin:0 auto}
h1{font-family:'Amiri','Geeza Pro',serif;font-size:30px;line-height:1.4;background:var(--goldG);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);line-height:1.8}
a.b{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:16px;font-size:18px;font-weight:800;text-decoration:none}
a.p{background:var(--goldG);color:#2a1d02}
a.s{background:var(--panel);border:1px solid var(--line);color:var(--ink)}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.how{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:right;line-height:1.9;font-size:15px}
.how b{color:var(--gold);display:block;font-size:16px}
.how ol{padding-inline-start:20px;color:var(--muted)}
.tab{display:flex;gap:8px;justify-content:center}
.tab button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;font-size:15px;font-weight:700}
.tab button.on{border-color:var(--teal);color:var(--teal)}
footer{color:var(--muted);font-size:13px}
footer b{color:var(--gold)}
</style>
</head>
<body>
<main>
 <img src="icon-192.png" alt="">
 <h1>ورشة التعلم عن بعد</h1>
 <p class="sub">المعوقات والحلول: العرض التفاعلي كاملًا، بأدواته وشروحاته وروابطه.</p>
 <a class="b p" href="workshop.html"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>افتح العرض الآن</a>
 <a class="b s" href="workshop.html" download="ورشة-التعلم-عن-بعد.html"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>حمّل الملف على جهازك</a>
 <div class="tab"><button data-t="ios" class="on">آيفون</button><button data-t="and">أندرويد</button><button data-t="pc">حاسوب</button></div>
 <div class="how" id="how"></div>
 <footer><b>أ. رشدي سيد</b> · ٩٦٦٩٠١٢٣</footer>
</main>
<script>
var T={
 ios:'<b>الأفضل على الآيفون: أيقونة على الشاشة الرئيسية</b><ol><li>اضغط «افتح العرض الآن».</li><li>من سفاري اضغط زر المشاركة (المربع والسهم).</li><li>اختر «إضافة إلى الشاشة الرئيسية».</li><li>بعد فتحه مرة مع الإنترنت يعمل بعدها بلا إنترنت.</li></ol>',
 and:'<b>على أندرويد</b><ol><li>اضغط «حمّل الملف على جهازك».</li><li>افتحه من التنزيلات باستخدام Chrome.</li><li>أو افتح العرض واختر من قائمة Chrome «إضافة إلى الشاشة الرئيسية».</li></ol>',
 pc:'<b>على الحاسوب</b><ol><li>اضغط «حمّل الملف على جهازك».</li><li>افتح الملف بأي متصفح (Chrome أو Edge).</li><li>يعمل بلا إنترنت، ما عدا التصويت المباشر وروابط الأدوات.</li></ol>'};
var how=document.getElementById('how'),bs=document.querySelectorAll('.tab button');
function show(k){how.innerHTML=T[k];bs.forEach(function(b){b.classList.toggle('on',b.dataset.t===k)})}
bs.forEach(function(b){b.onclick=function(){show(b.dataset.t)}});
var ua=navigator.userAgent;show(/iPhone|iPad|iPod/.test(ua)?'ios':/Android/.test(ua)?'and':'pc');
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
</html>
